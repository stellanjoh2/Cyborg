name: Build pinned voice runtimes

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-voice-runtime.yml'
      - 'third_party/voice-runtime/**'

permissions:
  contents: write

concurrency:
  group: voice-runtime-main
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      EMSDK_COMMIT: 37b85e9eaee5be090569d018cca77a15cacc11b7
      EMSDK_VERSION: 3.1.47
      SOURCE_DATE_EPOCH: 1695859200
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            autoconf automake build-essential ca-certificates cmake git \
            libtool pkg-config python3

      - name: Install pinned Emscripten
        run: |
          git init "$RUNNER_TEMP/emsdk"
          git -C "$RUNNER_TEMP/emsdk" remote add origin \
            https://github.com/emscripten-core/emsdk.git
          git -C "$RUNNER_TEMP/emsdk" fetch --depth=1 origin "$EMSDK_COMMIT"
          git -C "$RUNNER_TEMP/emsdk" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/emsdk" rev-parse HEAD)" = "$EMSDK_COMMIT"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build pinned same-origin runtimes
        run: |
          set -o pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          rm -rf public/vendor/voice-runtime
          mkdir -p public/vendor/voice-runtime
          if ! bash third_party/voice-runtime/build-espeak.sh \
            public/vendor/voice-runtime 2>&1 | tee "$RUNNER_TEMP/espeak.log"; then
            message="$(tail -c 3000 "$RUNNER_TEMP/espeak.log" | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Direct eSpeak build failed::$message"
            exit 1
          fi
          if ! bash third_party/voice-runtime/build-piper-phonemizer.sh \
            public/vendor/voice-runtime 2>&1 | tee "$RUNNER_TEMP/piper.log"; then
            message="$(tail -c 3000 "$RUNNER_TEMP/piper.log" | sed ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Piper phonemizer build failed::$message"
            exit 1
          fi
          cp third_party/voice-runtime/source-manifest.json \
            public/vendor/voice-runtime/
          (
            cd public/vendor/voice-runtime
            sha256sum --check espeak-ng.sha256
            sha256sum --check piper_phonemize.sha256
          )

      - name: Commit reproducible runtime outputs
        run: |
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/vendor/voice-runtime
          if ! git diff --cached --quiet; then
            git commit -m "build: publish pinned voice runtimes"
            git push
          fi
