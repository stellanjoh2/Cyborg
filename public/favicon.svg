    <circle cx="27.5" cy="3.5" r="3.5" fill-opacity="0.34"/>
    <circle cx="39.5" cy="3.5" r="3.5" fill-opacity="0.96"/>
    <!-- row 1 -->
    <circle cx="3.5" cy="15.5" r="3.5" fill-opacity="0.34"/>
