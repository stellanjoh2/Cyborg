    <circle cx="51.5" cy="39.5" r="3.5" fill-opacity="0.34"/>
    <!-- row 4: cols 1–3 -->
    <circle cx="15.5" cy="51.5" r="3.5" fill-opacity="0.08"/>
    <circle cx="27.5" cy="51.5" r="3.5" fill-opacity="0.34"/>
    <circle cx="39.5" cy="51.5" r="3.5" fill-opacity="0.96"/>
