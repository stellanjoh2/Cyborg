    <circle cx="27.5" cy="15.5" r="3.5" fill-opacity="0.08"/>
    <circle cx="39.5" cy="15.5" r="3.5" fill-opacity="0.62"/>
    <circle cx="51.5" cy="15.5" r="3.5" fill-opacity="0.34"/>
    <!-- row 2 -->
    <circle cx="3.5" cy="27.5" r="3.5" fill-opacity="0.96"/>
